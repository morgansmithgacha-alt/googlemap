<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS Logger</title>
</head>
<body>
  <h2>GPS Logger Active</h2>
  <p>When you press “Allow”, your location will be sent to Google Sheets.</p>

  <script>
    // Ask for location permission and send coordinates to Google Apps Script
    navigator.geolocation.getCurrentPosition(
      function(pos) {
        // ✅ Replace with your own Apps Script URL
        const endpoint = "https://script.google.com/macros/s/AKfycbwzC6M8EoUEHNAJvMjTpkfh9VVz10SZT3EqEnjCNW45ljaywflUtBhPBpZh050LDNMS4w/exec";

        // Send data to Google Sheets
        fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            lat: pos.coords.latitude,
            lon: pos.coords.longitude,
            accuracy: pos.coords.accuracy,
            timestamp: new Date().toISOString()
          })
        })
        .then(() => {
          document.body.innerHTML += "<p>✅ Location sent successfully!</p>";
        })
        .catch(err => {
          document.body.innerHTML += "<p>❌ Error sending location: " + err + "</p>";
        });
      },
      function(error) {
        document.body.innerHTML += "<p>⚠️ Location access denied or unavailable.</p>";
      }
    );
  </script>
</body>
</html>
